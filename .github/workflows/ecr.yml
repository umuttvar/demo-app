name: Build and push to ECR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4      
        
      - name: AWS'ye OIDC ile giriş
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: ECR'a docker login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build ve push
        env:
          IMAGE: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          TAG="${GITHUB_SHA::7}"
          docker build -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: GitOps reposunu güncelle
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/umuttvar/aws-platform.git" gitops
          cd gitops
          test -n "$TAG" || { echo "TAG boş, durduruyorum"; exit 1; }
          sed -i "s/^  tag: .*/  tag: \"${TAG}\"/" gitops/charts/demo-app/values.yaml
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(demo-app): deploy image ${TAG}"
          git pull --rebase
          git push